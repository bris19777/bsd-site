<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a href="index.html" class="logo"><img src="bsd-title.png" alt="BSD מחשבים – מכירה, שירות, תמיכה" width="225" height="33"></a>

  <main>
    <section class="hero hero-sm">
      <div class="wrap hero-inner">
        <a href="index.html" class="back">→ חזרה לדף הבית</a>
        <h1>מדריכים וקבצים</h1>

      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="guides-search">
          <input type="search" id="q" placeholder="חיפוש מדריך או קובץ…" aria-label="חיפוש">

        <p class="guides-empty" id="empty" hidden>לא נמצאו תוצאות. <a data-wa="שלום, חיפשתי באתר מדריך ולא מצאתי" data-subject="חיפוש מדריך באתר" href="#">שאלו אותנו בוואטסאפ</a></p>

  <footer class="site-footer">
    <div class="wrap">
      <p>© <span id="year"></span> BSD מחשבים · מכירה, שירות ותמיכה · 054-457-8946</p>
    </div>
  </footer>

  <script src="contact.js?v=6"></script>
  <script src="guides.js?v=8"></script>
  <script>
    const ICONS = { pdf: "📄", doc: "📝", zip: "🗜", exe: "💾", image: "🖼", video: "🎬", link: "🔗", page: "🖥" };
    const LABELS = { pdf: "PDF", doc: "מסמך", zip: "ZIP", exe: "תוכנה", image: "תמונה", video: "וידאו", link: "קישור", page: "עמוד" };

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function item(g) {
      const a = el("a", "guide");
      a.href = g.href;
      const external = /^https?:/.test(g.href);
      const isFile = !external && g.type !== "page";
      if (external) { a.target = "_blank"; a.rel = "noopener"; }
      if (isFile && ["exe", "zip"].includes(g.type)) a.setAttribute("download", "");
      a.dataset.text = (g.title + " " + (g.desc || "")).toLowerCase();

      a.append(el("div", "guide-ic", ICONS[g.type] || "📄"));
      const body = el("div", "guide-body");
      body.append(el("h3", null, g.title));
      if (g.desc) body.append(el("p", null, g.desc));
      const meta = el("div", "guide-meta");
      meta.append(el("span", "chip", LABELS[g.type] || g.type));
      if (g.size) meta.append(el("span", "guide-size", g.size));
      body.append(meta);
      a.append(body);
      const isDownload = isFile || (external && ["exe", "zip", "pdf"].includes(g.type));
      a.append(el("span", "guide-go", isDownload ? "הורדה ↓" : external ? "פתיחה ↗" : "צפייה ←"));
      return a;
    }

    const root = document.getElementById("sections");
    GUIDE_SECTIONS.forEach(s => {
      const list = GUIDES.filter(g => g.section === s.id);
      const sec = el("div", "guides-section");
      sec.dataset.section = s.id;
      const head = el("div", "section-head");
      head.append(el("h2", null, s.name), el("p", null, s.desc));
      sec.append(head);
      const grid = el("div", "guides-grid");
      if (list.length) list.forEach(g => grid.append(item(g)));
      else grid.append(el("p", "guides-soon", "חומרים חדשים יעלו בקרוב."));
      sec.append(grid);
      root.append(sec);
    });

    document.getElementById("q").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      let any = false;
      root.querySelectorAll(".guides-section").forEach(sec => {
        let shown = 0;
        sec.querySelectorAll(".guide").forEach(g => {
          const hit = !q || g.dataset.text.includes(q);
          g.hidden = !hit;
          if (hit) shown++;
        });
        const soon = sec.querySelector(".guides-soon");
        if (soon) soon.hidden = !!q;
        sec.hidden = !!q && shown === 0;
        if (!sec.hidden) any = true;
      });
      document.getElementById("empty").hidden = any;
    });
  </script>
</body>
</html>
