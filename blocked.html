  <style>
    :root {
      --navy: #15396B;
      --navy-2: #0F2A52;
      --accent: #2F7FE6;
      --accent-soft: #E8F1FD;
      --wa: #1FA855;
      --ink: #1B2333;
      --muted: #5B6578;
      --line: #E3E8F0;
      --card: #FFFFFF;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      padding: 36px 32px 28px;
      text-align: center;
    }
    .logo { height: 33px; width: auto; margin: 0 auto 28px; display: block; }
    .shield {
      width: 84px; height: 84px; margin: 0 auto 18px;
      border-radius: 50%; background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .shield svg { width: 46px; height: 46px; }
    h1 { margin: 0 0 8px; font-size: 30px; font-weight: 700; color: var(--navy); }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 16px; }
    .url {
      display: none;
      margin: 0 0 22px; padding: 10px 14px;
      background: #F4F7FB; border: 1px solid var(--line); border-radius: 10px;
      font-family: ui-monospace, Consolas, monospace; font-size: 14px; color: var(--ink);
      direction: ltr; word-break: break-all;
    }
    .url.show { display: block; }
    .help {
      border-top: 1px solid var(--line);
      padding-top: 18px; margin-top: 4px;
      font-size: 15px; color: var(--muted);
    }
    .help strong { color: var(--ink); }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px; border-radius: 999px; font-weight: 500; font-size: 15px;
      text-decoration: none; color: #fff;
    }
    .btn-primary { background: var(--accent); }
    .btn-primary:hover { background: #1F6BD0; }
    .btn-wa { background: var(--wa); }
    .btn-wa:hover { background: #178A45; }
    footer { margin-top: 18px; color: rgba(255,255,255,.7); font-size: 13px; text-align: center; }
    @media (max-width: 420px) {
      .card { padding: 28px 20px 22px; }
      h1 { font-size: 26px; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
